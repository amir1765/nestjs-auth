version: '3.9'

services:
  postgres:
    image: postgres:latest
    container_name: bytewallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bytewallet.io
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bytewallet.io"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: bytewallet-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory-policy noeviction
      --maxmemory 256mb
      --save 60 1
      --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: NestJS API service (uncomment when ready)
  # api:
  #   build: .
  #   container_name: bytewallet-api
  #   restart: unless-stopped
  #   ports:
  #     - "3001:3001"
  #   environment:
  #     NODE_ENV: development
  #     PORT: 3001
  #     DATABASE_URL: postgresql://admin:admin@postgres:5432/bytewallet.io?schema=public
  #     REDIS_URL: redis://redis:6379
  #     JWT_SECRET: ${JWT_SECRET}
  #     JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  #     # ... other env vars
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   volumes:
  #     - ./logs:/app/logs
  #     - ./uploads:/app/uploads

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
